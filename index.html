<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Develop with Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,500;0,700;1,700&display=swap">
<style>
  :root { --ink: #10111c; --paper: #f6f5f0; --pink: #ff5fa2; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 2.5rem; padding: 1rem; background: var(--ink); color: var(--paper); font-family: var(--mono) }
  h1 { margin: 0; font-size: clamp(1.1rem, 5vw, 2rem); line-height: 1.4; white-space: pre; font-weight: 700 }
  .d { opacity: .45 }
  em { font-style: normal; background: var(--pink); color: var(--ink); padding: 0 .25em }
  a { color: inherit; font-size: .75rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid; opacity: .65 }
  a:hover, a:focus-visible { opacity: 1 }
</style>
</head>
<body>
<h1><span class="d"><i>develop</i> {
  with:</span> <em>style</em><span class="d">;
}</span></h1>
<a href="https://github.com/joelmoss">github.com/joelmoss</a>
</body>
</html>
